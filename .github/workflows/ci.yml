name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests and coverage thresholds
        run: npm run test:unit:coverage
      - name: Typecheck
        run: npm run typecheck
      - name: OpenAPI drift
        run: npm run api:types:check
      - name: Migration replay
        env:
          DATABASE_URL: postgresql://prepvi:prepvi@localhost:5432/prepvi
          NODE_ENV: test
          SESSION_SECRET: ci-only-session-secret-not-for-deployment
        run: npm run db:migrate && npm run db:migrate
      - name: Reference seed verification
        env:
          DATABASE_URL: postgresql://prepvi:prepvi@localhost:5432/prepvi
          NODE_ENV: test
        run: npm run db:seed:reference && npm run db:seed:reference && npm run db:seed:verify
      - name: Build
        run: npm run build
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: prepvi
          POSTGRES_USER: prepvi
          POSTGRES_PASSWORD: prepvi
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U prepvi -d prepvi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
