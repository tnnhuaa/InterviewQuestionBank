services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: prepvi
      POSTGRES_USER: prepvi
      POSTGRES_PASSWORD: prepvi
    ports:
      - "5432:5432"
    volumes:
      - prepvi_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prepvi -d prepvi"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  prepvi_postgres:
