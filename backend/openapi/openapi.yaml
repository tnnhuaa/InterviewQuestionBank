components:
  securitySchemes:
    sessionCookie: { type: apiKey, in: cookie, name: __Host-prepvi_session }
  parameters:
    IdempotencyKey:
      {
        name: Idempotency-Key,
        in: header,
        required: true,
        schema: { type: string, minLength: 8, maxLength: 200 },
      }
    QuestionId:
      { name: questionId, in: path, required: true, schema: { type: string } }
    JobDescriptionId:
      {
        name: jobDescriptionId,
        in: path,
        required: true,
        schema: { type: string, format: uuid },
      }
    PlanId:
      {
        name: planId,
        in: path,
        required: true,
        schema: { type: string, format: uuid },
      }
    MentorId:
      {
        name: mentorId,
        in: path,
        required: true,
        schema: { type: string, format: uuid },
      }
    BookingId:
      {
        name: bookingId,
        in: path,
        required: true,
        schema: { type: string, format: uuid },
      }
    CaseId:
      {
        name: caseId,
        in: path,
        required: true,
        schema: { type: string, format: uuid },
      }
    AiJobId:
      {
        name: jobId,
        in: path,
        required: true,
        schema: { type: string, format: uuid },
      }
    DraftId:
      {
        name: draftId,
        in: path,
        required: true,
        schema: { type: string, format: uuid },
      }
  requestBodies:
    JsonInput:
      required: true
      content:
        application/json:
          schema: { type: object, additionalProperties: true }
  schemas:
    InAppNotification:
      type: object
      additionalProperties: false
      required: [id, eventType, title, body, resourceType, resourceId, readAt, createdAt]
      properties:
        id: { type: string, format: uuid }
        eventType: { type: string }
        title: { type: string }
        body: { type: string }
        resourceType: { type: [string, "null"] }
        resourceId: { type: [string, "null"], format: uuid }
        readAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }
    NotificationListResponse:
      type: object
      additionalProperties: false
      required: [items, unread]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/InAppNotification" }
        unread: { type: integer, minimum: 0 }
    NotificationReadResult:
      type: object
      additionalProperties: false
      required: [id, readAt]
      properties:
        id: { type: string, format: uuid }
        readAt: { type: string, format: date-time }
    Recovery:
      type: object
      required: [kind, retryable, retryAfterSeconds]
      properties:
        kind:
          {
            type: string,
            enum:
              [
                RETRY_SAFE,
                EDIT_INPUT,
                REUPLOAD,
                PASTE_TEXT,
                SELECT_ANOTHER_SLOT,
                WAIT,
                CONTACT_SUPPORT,
                NONE,
              ],
          }
        retryable: { type: boolean }
        retryAfterSeconds: { type: [integer, "null"] }
    Error:
      type: object
      additionalProperties: false
      required: [code, message, correlationId, fieldErrors, recovery]
      properties:
        code: { type: string }
        message: { type: string }
        correlationId: { type: string, format: uuid }
        fieldErrors: { type: object, additionalProperties: { type: string } }
        recovery: { $ref: "#/components/schemas/Recovery" }
    User:
      type: object
      required: [id, email, displayName, roles]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        displayName: { type: string }
        status: { type: string }
        roles:
          {
            type: array,
            items: { type: string, enum: [STUDENT, MENTOR, ADMIN] },
          }
    RegisterInput:
      type: object
      required: [email, password, displayName]
      properties:
        {
          email: { type: string, format: email },
          password: { type: string, minLength: 8, writeOnly: true },
          displayName: { type: string, minLength: 2 },
        }
    LoginInput:
      type: object
      required: [email, password]
      properties:
        {
          email: { type: string, format: email },
          password: { type: string, writeOnly: true },
        }
    TokenInput:
      type: object
      required: [token]
      properties: { token: { type: string, writeOnly: true } }
    Difficulty: { type: string, enum: [EASY, MEDIUM, HARD] }
    BookingStatus:
      {
        type: string,
        enum:
          [
            PENDING,
            CONFIRMED,
            RESCHEDULE_PROPOSED,
            REJECTED,
            CANCELLED,
            COMPLETED,
            NO_SHOW,
          ],
      }
    Question:
      type: object
      required:
        [
          id,
          slug,
          title,
          content,
          difficulty,
          lifecycleStatus,
          topics,
          positions,
          version,
        ]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        title: { type: string }
        content: { type: string }
        answerCriteria: { type: array, items: { type: string } }
        difficulty: { $ref: "#/components/schemas/Difficulty" }
        lifecycleStatus:
          { type: string, enum: [DRAFT, IN_REVIEW, PUBLISHED, ARCHIVED] }
        topics: { type: array, items: { type: string } }
        positions: { type: array, items: { type: string } }
        version: { type: integer }
    JobDescription:
      type: object
      required: [id, sourceType, status, correctedVersion, version]
      properties:
        id: { type: string, format: uuid }
        sourceType: { type: string, enum: [PASTED_TEXT, PDF, IMAGE] }
        status:
          {
            type: string,
            enum:
              [
                DRAFT,
                EXTRACTING,
                READY_FOR_REVIEW,
                CONFIRMED,
                ANALYZED,
                FAILED,
              ],
          }
        correctedText: { type: [string, "null"] }
        correctedVersion: { type: integer }
        version: { type: integer }
    Booking:
      type: object
      required: [id, mentorId, slotId, status, startsAt, endsAt, version]
      properties:
        id: { type: string, format: uuid }
        mentorId: { type: string, format: uuid }
        slotId: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/BookingStatus" }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        version: { type: integer }
    AiJob:
      type: object
      required:
        [
          id,
          kind,
          resourceType,
          resourceId,
          status,
          provider,
          model,
          promptVersion,
          schemaVersion,
          attemptCount,
          maxAttempts,
          fallbackUsed,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { type: string, format: uuid }
        kind:
          {
            type: string,
            enum:
              [
                JD_ANALYSIS,
                RECOMMENDATION_EXPLANATION,
                INTERVIEW_AGENDA,
                FEEDBACK_DRAFT,
              ],
          }
        resourceType:
          { type: string, enum: [JOB_DESCRIPTION, PREPARATION_PLAN, BOOKING] }
        resourceId: { type: string, format: uuid }
        status:
          {
            type: string,
            enum:
              [
                PENDING,
                PROCESSING,
                SUCCEEDED,
                SUCCEEDED_WITH_FALLBACK,
                FAILED,
                CANCELLED,
              ],
          }
        provider: { type: string }
        model: { type: string }
        promptVersion: { type: string }
        schemaVersion: { type: string }
        attemptCount: { type: integer, minimum: 0 }
        maxAttempts: { type: integer, minimum: 1 }
        fallbackUsed: { type: boolean }
        result: { type: [object, "null"], additionalProperties: true }
        errorCode: { type: [string, "null"] }
        correlationId: { type: [string, "null"], format: uuid }
        operationCaseId: { type: [string, "null"], format: uuid }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AiCapabilities:
      type: object
      required: [provider, model, enabled, available, features]
      properties:
        provider: { type: string }
        model: { type: string }
        enabled: { type: boolean }
        available: { type: boolean }
        features:
          type: object
          required:
            [jdAnalysis, recommendationExplanation, agendaDraft, feedbackDraft]
          properties:
            jdAnalysis: { type: boolean }
            recommendationExplanation: { type: boolean }
            agendaDraft: { type: boolean }
            feedbackDraft: { type: boolean }
    AgendaDraft:
      type: object
      additionalProperties: true
      required: [id, bookingId, jobId, agenda, status, version]
      properties:
        id: { type: string, format: uuid }
        bookingId: { type: string, format: uuid }
        jobId: { type: string, format: uuid }
        agenda:
          { type: array, items: { type: object, additionalProperties: true } }
        status: { type: string, enum: [DRAFT, USED, DISCARDED] }
        version: { type: integer, minimum: 1 }
    FeedbackDraft:
      type: object
      additionalProperties: true
      required:
        [
          id,
          bookingId,
          jobId,
          rubricScores,
          strengths,
          weaknesses,
          nextActions,
          status,
          version,
        ]
      properties:
        id: { type: string, format: uuid }
        bookingId: { type: string, format: uuid }
        jobId: { type: string, format: uuid }
        rubricScores: { type: object, additionalProperties: { type: number } }
        strengths: { type: string }
        weaknesses: { type: string }
        nextActions:
          { type: array, items: { type: object, additionalProperties: true } }
        status: { type: string, enum: [DRAFT, USED, DISCARDED] }
        version: { type: integer, minimum: 1 }
    PageInfo:
      type: object
      required: [page, pageSize, total]
      properties:
        {
          page: { type: integer },
          pageSize: { type: integer },
          total: { type: integer },
        }
    PublicAvailabilitySlot:
      type: object
      additionalProperties: false
      required: [id, startsAt, endsAt, timezone]
      properties:
        id: { type: string, format: uuid }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        timezone: { type: string }
    PublicMentor:
      type: object
      additionalProperties: false
      required:
        [id, displayName, headline, bio, timezone, expertise, positionExpertise, nextSlots, version]
      properties:
        id: { type: string, format: uuid }
        displayName: { type: string }
        headline: { type: string }
        bio: { type: string }
        timezone: { type: string }
        publicRating: { type: [number, "null"] }
        expertise:
          { type: array, items: { type: string } }
        positionExpertise:
          { type: array, items: { type: string } }
        nextSlots:
          { type: array, items: { $ref: "#/components/schemas/PublicAvailabilitySlot" } }
        version: { type: integer, minimum: 1 }
    PublicReview:
      type: object
      additionalProperties: false
      required: [id, rating, studentName, createdAt]
      properties:
        id: { type: string, format: uuid }
        rating: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: [string, "null"] }
        studentName: { type: string }
        createdAt: { type: string, format: date-time }
    PublicMentorDetail:
      allOf:
        - $ref: "#/components/schemas/PublicMentor"
        - type: object
          properties:
            reviews:
              { type: array, items: { $ref: "#/components/schemas/PublicReview" } }
    MentorSearchContext:
      type: object
      additionalProperties: false
      required: [matchingMentorCount, availabilityFiltered, emptyReason]
      properties:
        matchingMentorCount: { type: integer, minimum: 0 }
        availabilityFiltered: { type: boolean }
        emptyReason:
          { type: [string, "null"], enum: [NO_MATCHING_MENTOR, NO_AVAILABLE_SLOT, null] }
    MentorSearchResponse:
      type: object
      additionalProperties: false
      required: [items, pageInfo, searchContext]
      properties:
        items:
          { type: array, items: { $ref: "#/components/schemas/PublicMentor" } }
        pageInfo: { $ref: "#/components/schemas/PageInfo" }
        searchContext: { $ref: "#/components/schemas/MentorSearchContext" }
    PlanMentorCandidate:
      allOf:
        - $ref: "#/components/schemas/PublicMentor"
        - type: object
          additionalProperties: false
          required: [topicOverlap, positionFit, matchReasons]
          properties:
            topicOverlap: { type: integer, minimum: 0 }
            positionFit: { type: integer, minimum: 0 }
            matchReasons:
              { type: array, items: { type: string } }
            aiExplanation: { type: [string, "null"] }
    PlanMentorCandidateResponse:
      type: object
      additionalProperties: false
      required: [planId, planVersion, items, pageInfo, searchContext]
      properties:
        planId: { type: string, format: uuid }
        planVersion: { type: integer, minimum: 1 }
        items:
          { type: array, items: { $ref: "#/components/schemas/PlanMentorCandidate" } }
        pageInfo: { $ref: "#/components/schemas/PageInfo" }
        searchContext: { $ref: "#/components/schemas/MentorSearchContext" }
    MentorVerificationStatus:
      type: string
      enum: [DRAFT, PENDING, APPROVED, REJECTED]
    MentorReviewStatus:
      type: string
      enum: [PENDING, APPROVED, REJECTED]
    MentorProfileInput:
      type: object
      additionalProperties: false
      required: [headline, bio, timezone, topicIds, positionIds]
      properties:
        headline: { type: string, minLength: 5, maxLength: 180 }
        bio: { type: string, minLength: 20, maxLength: 4000 }
        timezone: { type: string, minLength: 1, maxLength: 80 }
        topicIds:
          type: array
          minItems: 1
          maxItems: 20
          uniqueItems: true
          items: { type: string, format: uuid }
        positionIds:
          type: array
          minItems: 1
          maxItems: 20
          uniqueItems: true
          items: { type: string, format: uuid }
        expertiseEvidence: { type: string, maxLength: 1000 }
    MentorLatestVerification:
      type: object
      additionalProperties: false
      required: [id, status, submittedAt, version]
      properties:
        id: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/MentorReviewStatus" }
        submittedAt: { type: string, format: date-time }
        decidedAt: { type: [string, "null"], format: date-time }
        decisionReason: { type: [string, "null"] }
        version: { type: integer, minimum: 1 }
    MentorOwnProfile:
      type: object
      additionalProperties: false
      required:
        [
          id,
          userId,
          displayName,
          headline,
          bio,
          timezone,
          verificationStatus,
          expertise,
          positionExpertise,
          topicIds,
          positionIds,
          nextSlots,
          latestVerification,
          version,
        ]
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        displayName: { type: string }
        headline: { type: string }
        bio: { type: string }
        timezone: { type: string }
        verificationStatus:
          { $ref: "#/components/schemas/MentorVerificationStatus" }
        publicRating: { type: [number, "null"] }
        expertise: { type: array, items: { type: string } }
        positionExpertise: { type: array, items: { type: string } }
        topicIds: { type: array, items: { type: string, format: uuid } }
        positionIds: { type: array, items: { type: string, format: uuid } }
        nextSlots:
          { type: array, items: { type: object, additionalProperties: true } }
        latestVerification:
          anyOf:
            - $ref: "#/components/schemas/MentorLatestVerification"
            - type: "null"
        version: { type: integer, minimum: 1 }
    MentorVerificationSubmission:
      type: object
      additionalProperties: false
      required: [verificationId, mentorId, status, submittedAt, version]
      properties:
        verificationId: { type: string, format: uuid }
        mentorId: { type: string, format: uuid }
        status: { type: string, const: PENDING }
        submittedAt: { type: string, format: date-time }
        version: { type: integer, minimum: 1 }
    AdminMentorVerificationQueueItem:
      type: object
      required:
        [
          verificationId,
          mentorId,
          displayName,
          headline,
          submittedAt,
          status,
          version,
        ]
      properties:
        verificationId: { type: string, format: uuid }
        mentorId: { type: string, format: uuid }
        displayName: { type: string }
        headline: { type: string }
        submittedAt: { type: string, format: date-time }
        status: { type: string, enum: [PENDING] }
        version: { type: integer, minimum: 1 }
    AdminMentorVerificationHistoryItem:
      type: object
      required: [verificationId, status, submittedAt]
      properties:
        verificationId: { type: string, format: uuid }
        status: { type: string, enum: [APPROVED, REJECTED] }
        submittedAt: { type: string, format: date-time }
        decidedAt: { type: [string, "null"], format: date-time }
        decisionReason: { type: [string, "null"] }
        decidedBy:
          oneOf:
            - type: object
              required: [id, displayName]
              properties:
                id: { type: string, format: uuid }
                displayName: { type: string }
            - type: "null"
    AdminMentorVerificationReview:
      type: object
      required:
        [
          verificationId,
          mentorId,
          status,
          version,
          submittedAt,
          mentor,
          evidence,
          priorDecisions,
        ]
      properties:
        verificationId: { type: string, format: uuid }
        mentorId: { type: string, format: uuid }
        status: { type: string, enum: [PENDING, APPROVED, REJECTED] }
        version: { type: integer, minimum: 1 }
        submittedAt: { type: string, format: date-time }
        mentor:
          type: object
          required: [displayName, headline, bio, timezone, topics, positions]
          properties:
            displayName: { type: string }
            headline: { type: string }
            bio: { type: string }
            timezone: { type: string }
            topics:
              type: array
              items:
                type: object
                required: [id, name]
                properties:
                  id: { type: string, format: uuid }
                  name: { type: string }
            positions:
              type: array
              items:
                type: object
                required: [id, name]
                properties:
                  id: { type: string, format: uuid }
                  name: { type: string }
        evidence:
          type: object
          required: [mimeType, sizeBytes]
          properties:
            mimeType: { type: string }
            sizeBytes: { type: integer, minimum: 0 }
        priorDecisions:
          type: array
          items:
            $ref: "#/components/schemas/AdminMentorVerificationHistoryItem"
    MentorVerificationDecisionInput:
      type: object
      additionalProperties: false
      required: [decision, reason, version]
      properties:
        decision: { type: string, enum: [APPROVED, REJECTED] }
        reason: { type: string, minLength: 3, maxLength: 1000 }
        version: { type: integer, minimum: 1 }
    MentorVerificationDecisionResult:
      type: object
      required:
        [
          verificationId,
          mentorId,
          status,
          reason,
          decidedAt,
          decidedBy,
          version,
        ]
      properties:
        verificationId: { type: string, format: uuid }
        mentorId: { type: string, format: uuid }
        status: { type: string, enum: [APPROVED, REJECTED] }
        reason: { type: string }
        decidedAt: { type: string, format: date-time }
        decidedBy: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
  responses:
    Success:
      {
