openapi: 3.1.0
info:
  title: PrepVI R1 API
  version: 1.0.0
  description: Same-origin API contract for PrepVI US-01–30. Sensitive fields are intentionally absent from error schemas.
servers:
  - url: /api/v1
security:
  - sessionCookie: []
paths:
  /health:
    get:
      security: []
      operationId: health
      responses: { "200": { $ref: "#/components/responses/Success" } }
  /readiness:
    get:
      security: []
      operationId: readiness
      responses:
        {
          "200": { $ref: "#/components/responses/Success" },
          "503": { $ref: "#/components/responses/Error" },
        }
  /ai/capabilities:
    get:
      operationId: getAiCapabilities
      responses: { "200": { $ref: "#/components/responses/AiCapabilities" } }
  /ai-jobs/{jobId}:
    parameters: [{ $ref: "#/components/parameters/AiJobId" }]
    get:
      operationId: getAiJob
      responses:
        {
          "200": { $ref: "#/components/responses/AiJob" },
          "404": { $ref: "#/components/responses/Error" },
        }
  /ai-jobs/{jobId}/retry:
    parameters:
      [
        { $ref: "#/components/parameters/AiJobId" },
        { $ref: "#/components/parameters/IdempotencyKey" },
      ]
    post:
      operationId: retryAiJob
      responses:
        {
          "202": { $ref: "#/components/responses/AiJob" },
          "409": { $ref: "#/components/responses/Error" },
        }
  /auth/register:
    post:
      security: []
      operationId: register
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/RegisterInput" } },
            },
        }
      responses:
        {
          "201": { $ref: "#/components/responses/User" },
          "409": { $ref: "#/components/responses/Error" },
        }
  /auth/verify-email:
    post:
      security: []
      operationId: verifyEmail
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/TokenInput" } },
            },
        }
      responses:
        {
          "200": { $ref: "#/components/responses/User" },
          "400": { $ref: "#/components/responses/Error" },
        }
  /auth/login:
    post:
      security: []
      operationId: login
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/LoginInput" } },
            },
        }
      responses:
        {
          "200": { $ref: "#/components/responses/Login" },
          "401": { $ref: "#/components/responses/Error" },
        }
  /auth/logout:
    post:
      operationId: logout
      responses:
        {
          "204": { description: Session revoked },
          "403": { $ref: "#/components/responses/Error" },
        }
  /auth/csrf:
    get:
      operationId: rotateCsrf
      responses: { "200": { $ref: "#/components/responses/Success" } }
  /auth/forgot-password:
    post:
      security: []
      operationId: forgotPassword
      requestBody: { $ref: "#/components/requestBodies/JsonInput" }
      responses: { "202": { $ref: "#/components/responses/Success" } }
  /auth/reset-password:
    post:
      security: []
      operationId: resetPassword
      requestBody: { $ref: "#/components/requestBodies/JsonInput" }
      responses:
        {
          "204": { description: Password changed },
          "400": { $ref: "#/components/responses/Error" },
        }
  /auth/accept-admin-invite:
    post:
      security: []
      operationId: acceptAdminInvite
      requestBody: { $ref: "#/components/requestBodies/JsonInput" }
      responses:
        {
          "200": { $ref: "#/components/responses/User" },
          "400": { $ref: "#/components/responses/Error" },
        }
  /me:
    get:
      operationId: me
      responses:
        {
          "200": { $ref: "#/components/responses/User" },
          "401": { $ref: "#/components/responses/Error" },
        }
  /student-profile:
    get:
      operationId: getStudentProfile
      responses: { "200": { $ref: "#/components/responses/Success" } }
    patch:
      operationId: updateStudentProfile
      requestBody: { $ref: "#/components/requestBodies/JsonInput" }
      responses:
        {
          "200": { $ref: "#/components/responses/Success" },
          "409": { $ref: "#/components/responses/Error" },
        }
  /taxonomy:
    get:
      security: []
      operationId: getTaxonomy
      responses: { "200": { $ref: "#/components/responses/Success" } }
  /questions:
    get:
      security: []
      operationId: listQuestions
      parameters:
        - { name: search, in: query, schema: { type: string } }
        - { name: topic, in: query, schema: { type: string } }
        - {
            name: difficulty,
            in: query,
            schema: { $ref: "#/components/schemas/Difficulty" },
          }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - {
            name: pageSize,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100 },
          }
      responses: { "200": { $ref: "#/components/responses/QuestionPage" } }
  /questions/{questionId}:
    parameters: [{ $ref: "#/components/parameters/QuestionId" }]
    get:
      security: []
      operationId: getQuestion
      responses:
        {
          "200": { $ref: "#/components/responses/Question" },
          "404": { $ref: "#/components/responses/Error" },
        }
  /practice-progress/{questionId}:
    parameters: [{ $ref: "#/components/parameters/QuestionId" }]
    put:
      operationId: updatePracticeProgress
      requestBody: { $ref: "#/components/requestBodies/JsonInput" }
      responses: { "200": { $ref: "#/components/responses/Success" } }
  /admin/questions:
    get:
      operationId: adminListQuestions
      parameters:
        - { name: search, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - {
            name: pageSize,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100 },
          }
      responses: { "200": { $ref: "#/components/responses/QuestionPage" } }
    post:
      operationId: createQuestion
      requestBody: { $ref: "#/components/requestBodies/JsonInput" }
      responses:
        {
          "201": { $ref: "#/components/responses/Question" },
          "422": { $ref: "#/components/responses/Error" },
        }
  /admin/questions/{questionId}:
    parameters: [{ $ref: "#/components/parameters/QuestionId" }]
    put:
      operationId: updateQuestion
      requestBody: { $ref: "#/components/requestBodies/JsonInput" }
      responses:
        {
          "200": { $ref: "#/components/responses/Question" },
          "409": { $ref: "#/components/responses/Error" },
        }
  /admin/questions/{questionId}/lifecycle:
    parameters: [{ $ref: "#/components/parameters/QuestionId" }]
    patch:
      operationId: changeQuestionLifecycle
      requestBody: { $ref: "#/components/requestBodies/JsonInput" }
      responses:
        {
          "200": { $ref: "#/components/responses/Question" },
          "409": { $ref: "#/components/responses/Error" },
        }
  /admin/taxonomy:
    get:
      operationId: adminGetTaxonomy
      responses: { "200": { $ref: "#/components/responses/Success" } }
  /admin/taxonomy/versions:
    post:
      operationId: createTaxonomyVersion
      requestBody: { $ref: "#/components/requestBodies/JsonInput" }
      responses: { "201": { $ref: "#/components/responses/Success" } }
  /admin/taxonomy/versions/{versionId}:
    parameters:
      [
        {
          name: versionId,
          in: path,
          required: true,
          schema: { type: string, format: uuid },
        },
      ]
    patch:
      operationId: updateTaxonomyVersion
      requestBody: { $ref: "#/components/requestBodies/JsonInput" }
      responses:
        {
          "200": { $ref: "#/components/responses/Success" },
          "409": { $ref: "#/components/responses/Error" },
        }
  /admin/topics:
    post:
      operationId: createTopic
      requestBody: { $ref: "#/components/requestBodies/JsonInput" }
      responses: { "201": { $ref: "#/components/responses/Success" } }
  /admin/topics/{itemId}:
    parameters:
      [
        {
          name: itemId,
          in: path,
          required: true,
          schema: { type: string, format: uuid },
        },
      ]
    patch:
      operationId: updateTopic
      requestBody: { $ref: "#/components/requestBodies/JsonInput" }
      responses:
        {
          "200": { $ref: "#/components/responses/Success" },
          "409": { $ref: "#/components/responses/Error" },
        }
  /admin/positions:
    post:
      operationId: createPosition
      requestBody: { $ref: "#/components/requestBodies/JsonInput" }
      responses: { "201": { $ref: "#/components/responses/Success" } }
  /admin/positions/{itemId}:
    parameters:
      [
        {
          name: itemId,
          in: path,
          required: true,
          schema: { type: string, format: uuid },
        },
      ]
    patch:
      operationId: updatePosition
      requestBody: { $ref: "#/components/requestBodies/JsonInput" }
      responses:
        {
          "200": { $ref: "#/components/responses/Success" },
          "409": { $ref: "#/components/responses/Error" },
        }
  /admin/topic-aliases:
    post:
      operationId: createTopicAlias
      requestBody: { $ref: "#/components/requestBodies/JsonInput" }
      responses: { "201": { $ref: "#/components/responses/Success" } }
  /admin/topic-aliases/{aliasId}:
    parameters:
      [
        {
          name: aliasId,
          in: path,
          required: true,
          schema: { type: string, format: uuid },
        },
      ]
    delete:
      operationId: deleteTopicAlias
      requestBody: { $ref: "#/components/requestBodies/JsonInput" }
      responses: { "204": { description: Alias deleted } }
  /job-descriptions:
    get:
      operationId: listJobDescriptions
      responses: { "200": { $ref: "#/components/responses/Page" } }
    post:
      operationId: createJobDescription
      requestBody:
        required: true
        content:
          application/json:
            {
              schema:
                {
                  type: object,
                  required: [text],
                  properties: { text: { type: string, maxLength: 50000 } },
                },
            }
          multipart/form-data:
            {
              schema:
                {
                  type: object,
                  required: [file],
                  properties: { file: { type: string, format: binary } },
                },
            }
      responses:
        {
          "201": { $ref: "#/components/responses/JobDescription" },
          "413": { $ref: "#/components/responses/Error" },
          "415": { $ref: "#/components/responses/Error" },
        }
  /job-descriptions/{jobDescriptionId}:
    parameters: [{ $ref: "#/components/parameters/JobDescriptionId" }]
    get:
      operationId: getJobDescription
      responses:
        {
          "200": { $ref: "#/components/responses/JobDescription" },
          "404": { $ref: "#/components/responses/Error" },
        }
  /job-descriptions/{jobDescriptionId}/extract:
    parameters:
      [
        { $ref: "#/components/parameters/JobDescriptionId" },
        { $ref: "#/components/parameters/IdempotencyKey" },
      ]
    post:
      operationId: startExtraction
      responses:
        {
          "202": { $ref: "#/components/responses/JobDescription" },
          "409": { $ref: "#/components/responses/Error" },
        }
  /job-descriptions/{jobDescriptionId}/extraction-retries:
    parameters:
      [
        { $ref: "#/components/parameters/JobDescriptionId" },
        { $ref: "#/components/parameters/IdempotencyKey" },
      ]
    post:
      operationId: retryExtraction
      responses: { "202": { $ref: "#/components/responses/JobDescription" } }
  /job-descriptions/{jobDescriptionId}/text:
    parameters: [{ $ref: "#/components/parameters/JobDescriptionId" }]
    patch:
      operationId: saveCorrectedText
      requestBody: { $ref: "#/components/requestBodies/JsonInput" }
      responses:
        {
          "200": { $ref: "#/components/responses/JobDescription" },
          "409": { $ref: "#/components/responses/Error" },
        }
  /job-descriptions/{jobDescriptionId}/confirm:
    parameters: [{ $ref: "#/components/parameters/JobDescriptionId" }]
    post:
      operationId: confirmCorrectedText
      requestBody: { $ref: "#/components/requestBodies/JsonInput" }
      responses:
        {
          "200": { $ref: "#/components/responses/JobDescription" },
          "409": { $ref: "#/components/responses/Error" },
        }
  /job-descriptions/{jobDescriptionId}/analyze:
    parameters:
      [
        { $ref: "#/components/parameters/JobDescriptionId" },
        { $ref: "#/components/parameters/IdempotencyKey" },
      ]
    post:
      operationId: analyzeJobDescription
      requestBody: { $ref: "#/components/requestBodies/JsonInput" }
      responses: { "200": { $ref: "#/components/responses/Success" } }
  /job-descriptions/{jobDescriptionId}/analysis-jobs:
    parameters:
      [
        { $ref: "#/components/parameters/JobDescriptionId" },
        { $ref: "#/components/parameters/IdempotencyKey" },
      ]
    post:
      operationId: startAiJobDescriptionAnalysis
      requestBody: { $ref: "#/components/requestBodies/JsonInput" }
      responses:
        {
          "202": { $ref: "#/components/responses/AiJob" },
          "409": { $ref: "#/components/responses/Error" },
          "503": { $ref: "#/components/responses/Error" },
        }
  /job-descriptions/{jobDescriptionId}/analysis:
    parameters: [{ $ref: "#/components/parameters/JobDescriptionId" }]
    get:
      operationId: getJobDescriptionAnalysis
      parameters:
        [
          {
            name: analysisVersion,
            in: query,
            schema: { type: integer, minimum: 1 },
          },
        ]
      responses: { "200": { $ref: "#/components/responses/Success" } }
  /job-descriptions/{jobDescriptionId}/requirement-normalizations:
    parameters: [{ $ref: "#/components/parameters/JobDescriptionId" }]
    put:
      operationId: saveRequirementNormalizations
      requestBody: { $ref: "#/components/requestBodies/JsonInput" }
      responses: { "200": { $ref: "#/components/responses/Success" } }
  /job-descriptions/{jobDescriptionId}/requirements/{requirementId}:
    parameters:
      - { $ref: "#/components/parameters/JobDescriptionId" }
      - {
          name: requirementId,
          in: path,
          required: true,
          schema: { type: string, format: uuid },
        }
    patch:
      operationId: decideAiRequirement
      requestBody: { $ref: "#/components/requestBodies/JsonInput" }
      responses:
        {
          "200": { $ref: "#/components/responses/Success" },
          "409": { $ref: "#/components/responses/Error" },
          "422": { $ref: "#/components/responses/Error" },
        }
  /job-descriptions/{jobDescriptionId}/matches:
    parameters: [{ $ref: "#/components/parameters/JobDescriptionId" }]
    get:
      operationId: getMatches
      parameters:
        [
          {
            name: analysisVersion,
            in: query,
            schema: { type: integer, minimum: 1 },
          },
        ]
      responses: { "200": { $ref: "#/components/responses/Success" } }
    post:
      operationId: createMatches
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { $ref: "#/components/requestBodies/JsonInput" }
      responses: { "200": { $ref: "#/components/responses/Success" } }
  /preparation-plans:
    get:
      operationId: listPreparationPlans
      responses: { "200": { $ref: "#/components/responses/Page" } }
    post:
      operationId: createPreparationPlan
      requestBody: { $ref: "#/components/requestBodies/JsonInput" }
      responses: { "201": { $ref: "#/components/responses/Success" } }
  /preparation-plans/{planId}:
    parameters: [{ $ref: "#/components/parameters/PlanId" }]
    get:
      operationId: getPreparationPlan
      responses:
        {
          "200": { $ref: "#/components/responses/Success" },
          "404": { $ref: "#/components/responses/Error" },
        }
  /preparation-plans/{planId}/items/{itemId}:
    parameters:
      - { $ref: "#/components/parameters/PlanId" }
      - {
          name: itemId,
          in: path,
          required: true,
          schema: { type: string, format: uuid },
        }
    patch:
      operationId: updatePreparationPlanItem
      requestBody: { $ref: "#/components/requestBodies/JsonInput" }
      responses:
        {
          "200": { $ref: "#/components/responses/Success" },
          "409": { $ref: "#/components/responses/Error" },
        }
  /preparation-plans/{planId}/mentor-candidates:
    parameters:
      - { $ref: "#/components/parameters/PlanId" }
      - {
          name: availableFrom,
          in: query,
          schema: { type: string, format: date-time },
        }
      - {
          name: availableTo,
          in: query,
          schema: { type: string, format: date-time },
        }
      - { name: page, in: query, schema: { type: integer, minimum: 1 } }
      - {
          name: pageSize,
          in: query,
          schema: { type: integer, minimum: 1, maximum: 100 },
        }
    get:
      operationId: listPreparationPlanMentorCandidates
      responses:
        "200":
          description: Approved Mentor candidates matching the Student's active preparation plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanMentorCandidateResponse"
        "404":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
  /preparation-plans/{planId}/recommendation-explanation-jobs:
    parameters:
      [
        { $ref: "#/components/parameters/PlanId" },
        { $ref: "#/components/parameters/IdempotencyKey" },
      ]
    post:
      operationId: startRecommendationExplanationJob
      responses:
        {
          "202": { $ref: "#/components/responses/AiJob" },
          "409": { $ref: "#/components/responses/Error" },
          "503": { $ref: "#/components/responses/Error" },
        }
  /mentors:
    get:
      security: []
      operationId: listMentors
      parameters:
        - { name: topic, in: query, schema: { type: string, maxLength: 100 } }
        - {
            name: availableFrom,
            in: query,
            schema: { type: string, format: date-time },
          }
        - {
            name: availableTo,
            in: query,
            schema: { type: string, format: date-time },
          }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - {
            name: pageSize,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100 },
          }
      responses:
        "200":
          description: Approved public Mentors matching the selected filters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MentorSearchResponse"
        "422":
          $ref: "#/components/responses/Error"
  /mentors/{mentorId}:
    parameters: [{ $ref: "#/components/parameters/MentorId" }]
    get:
      security: []
      operationId: getMentor
      responses:
        "200":
          description: Approved public Mentor profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicMentorDetail"
        "404":
          $ref: "#/components/responses/Error"
  /mentor-profile:
    get:
      operationId: getMentorProfile
      responses:
        "200":
          $ref: "#/components/responses/MentorOwnProfile"
        "404":
          $ref: "#/components/responses/Error"
    put:
      operationId: saveMentorProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MentorProfileInput"
      responses:
        "200":
          $ref: "#/components/responses/MentorOwnProfile"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
  /mentor-verifications:
    post:
      operationId: submitMentorVerification
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required:
                - consent
                - profileVersion
                - evidence
              properties:
                consent:
                  type: string
                  const: "true"
                profileVersion:
                  type: integer
                  minimum: 1
                evidence:
                  type: string
                  format: binary
      responses:
        "201":
          $ref: "#/components/responses/MentorVerificationSubmission"
        "409":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/Error"
        "415":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
  /availability-slots:
    get:
      operationId: listAvailabilitySlots
      responses: { "200": { $ref: "#/components/responses/Success" } }
    post:
      operationId: createAvailabilitySlot
      requestBody: { $ref: "#/components/requestBodies/JsonInput" }
      responses:
        {
          "201": { $ref: "#/components/responses/Success" },
          "409": { $ref: "#/components/responses/Error" },
        }
  /availability-slots/{slotId}:
    parameters:
      [
        {
          name: slotId,
          in: path,
          required: true,
          schema: { type: string, format: uuid },
        },
      ]
    delete:
      operationId: cancelAvailabilitySlot
      parameters:
        [
          {
            name: version,
            in: query,
            required: true,
            schema: { type: integer, minimum: 1 },
          },
        ]
      responses:
        {
          "204": { description: Cancelled },
          "409": { $ref: "#/components/responses/Error" },
        }
  /admin/mentor-verifications:
    get:
      operationId: listMentorVerifications
      responses:
        "200":
          description: Pending Mentor verification queue
          content:
            application/json:
              schema:
                type: object
                required: [items, pageInfo]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/AdminMentorVerificationQueueItem"
                  pageInfo:
                    $ref: "#/components/schemas/PageInfo"
        "403":
          $ref: "#/components/responses/Error"
  /admin/mentor-verifications/{verificationId}:
    parameters:
      - name: verificationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getMentorVerificationForReview
      responses:
        "200":
          description: Mentor verification Admin review detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminMentorVerificationReview"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /admin/mentor-verifications/{verificationId}/evidence:
    parameters:
      [
        {
          name: verificationId,
          in: path,
          required: true,
          schema: { type: string, format: uuid },
        },
      ]
    get:
      operationId: getMentorEvidence
      parameters:
        - {
            name: expires,
            in: query,
            required: true,
            schema: { type: integer, minimum: 1 },
          }
        - {
            name: signature,
            in: query,
            required: true,
            schema: { type: string, pattern: "^[0-9a-fA-F]{64}$" },
          }
      responses:
        {
          "200":
            {
              description: Restricted evidence,
              content:
                {
                  application/octet-stream:
                    { schema: { type: string, format: binary } },
                },
            },
        }
  /admin/mentor-verifications/{verificationId}/evidence-link:
    parameters:
      [
        {
          name: verificationId,
          in: path,
          required: true,
          schema: { type: string, format: uuid },
        },
      ]
    get:
      operationId: createMentorEvidenceLink
      responses:
        {
          "302": { description: Redirect to a five-minute signed evidence URL },
        }
  /admin/mentor-verifications/{verificationId}/decision:
    parameters:
      [
        {
          name: verificationId,
          in: path,
          required: true,
          schema: { type: string, format: uuid },
